<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>Sherriva 內部工具中心</title>
<style>
  :root {
    color-scheme: light;
    --brand-yellow: #FACA00;
    --brand-black:  #121212;
    --page:         #f8f7f3;
    --card:         #ffffff;
    --ink:          #121212;
    --sub:          #55534c;
    --muted:        #918f85;
    --line:         #e7e5db;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--page); color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", "PingFang TC", "Microsoft JhengHei", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 720px; margin: 0 auto; padding: 60px 20px 80px; }
  header { margin-bottom: 36px; }
  h1 { font-size: 28px; font-weight: 800; margin: 0 0 8px; }
  .sub { color: var(--sub); font-size: 14px; line-height: 1.6; }
  .grid { display: grid; gap: 16px; }
  a.tool-card {
    display: flex; align-items: center; gap: 16px;
    background: var(--card); border: 1px solid var(--line); border-top: 3px solid var(--brand-yellow);
    border-radius: 14px; padding: 20px 22px; text-decoration: none; color: inherit;
    transition: border-color 0.12s, transform 0.12s;
  }
  a.tool-card:hover { border-color: var(--ink); transform: translateY(-1px); }
  a.tool-card .icon { font-size: 30px; line-height: 1; }
  a.tool-card .body { flex: 1; }
  a.tool-card .title { font-size: 17px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
  a.tool-card .desc { font-size: 13px; color: var(--sub); margin-top: 4px; line-height: 1.5; }
  a.tool-card .arrow { font-size: 20px; color: var(--muted); }
  .tag { font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: #fdecec; color: #a02020; border: 1px solid #f0b9b9; }
  .placeholder {
    border: 1.5px dashed var(--line); border-radius: 14px; padding: 20px 22px;
    color: var(--muted); font-size: 13.5px; text-align: center;
  }
  footer { margin-top: 40px; color: var(--muted); font-size: 12px; line-height: 1.7; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Sherriva 內部工具中心</h1>
    <div class="sub">內部使用，各工具點進去是獨立網站/頁面。之後新增的儀表板都會加在這裡，只要記這一個網址就好。</div>
  </header>

  <div class="grid">
    <a class="tool-card" href="./dashboard/">
      <div class="icon">📊</div>
      <div class="body">
        <div class="title">Sherriva 銷售儀表板</div>
        <div class="desc">官網＋Amazon 銷售彙整，每日自動更新：經營提醒、每週逐日、週報、月報、庫存戰情</div>
      </div>
      <div class="arrow">→</div>
    </a>

    <a class="tool-card" href="https://px-meta.github.io/px-sherriva-cs-wonq/" target="_blank" rel="noopener">
      <div class="icon">🎧</div>
      <div class="body">
        <div class="title">Sherriva 客服查詢 <span class="tag">內部限定</span></div>
        <div class="desc">客服知識庫查詢工具，含內部型號/SKU/客訴資料，另外存放不對外公開</div>
      </div>
      <div class="arrow">↗</div>
    </a>

    <div class="placeholder">更多儀表板陸續加入中</div>
  </div>

  <footer>
    這個入口頁只是導覽用的連結列表，不含任何業務資料。點進去的各個工具各自獨立維護、獨立更新。
  </footer>
</div>
</body>
</html>
