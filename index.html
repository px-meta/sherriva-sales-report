    --text-muted:     #898781;
    --grid:           #e1e0d9;
    --axis:           #c3c2b7;
    --border:         rgba(11,11,11,0.10);
    --good:           #006300;
    --warning:        #8a6100;
    --critical:       #d03b3b;

    --series-amazon:   #eb6834; /* Amazon */

    --series-amazon-fill:   #fbd9c8;
  }

      color-scheme: dark;
      --surface-1:      #1a1a19;
      --page:           #0d0d0d;
      --text-primary:   #ffffff;
      --text-secondary: #c3c2b7;
      --text-muted:     #898781;
      --grid:           #2c2c2a;
      --axis:           #383835;
      --border:         rgba(255,255,255,0.10);
      --good:           #0ca30c;
      --warning:        #fab219;
      --critical:       #e66767;
      --series-official: #3987e5;
      --series-amazon:   #d95926;
      --series-official-fill: #1c3a5c;
      --series-amazon-fill:   #4a2c1c;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --surface-1:      #1a1a19;
    --page:           #0d0d0d;
    --text-primary:   #ffffff;
    --text-secondary: #c3c2b7;
    --text-muted:     #898781;
    --grid:           #2c2c2a;
    --axis:           #383835;
    --border:         rgba(255,255,255,0.10);
    --good:           #0ca30c;
    --warning:        #fab219;
    --critical:       #e66767;
    --series-official: #3987e5;
    --series-amazon:   #d95926;
    --series-official-fill: #1c3a5c;
    --series-amazon-fill:   #4a2c1c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--page);
    color: var(--text-primary);
    font-family: system-ui, -apple-system, "Segoe UI", "PingFang TC", "Microsoft JhengHei", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 28px 20px 80px; }
  header.top { display: flex; align-items: baseline; justify-content: space-between; flex-wrap: wrap; gap: 8px; margin-bottom: 6px; }
  h1 { font-size: 22px; font-weight: 700; margin: 0; }
  .updated { color: var(--text-muted); font-size: 13px; }
  .subnote { color: var(--text-secondary); font-size: 13px; margin: 4px 0 20px; line-height: 1.6; }
  .subnote b { color: var(--text-primary); }

  nav.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border); margin-bottom: 22px; }
  nav.tabs button {
    appearance: none; border: none; background: none; cursor: pointer;
    padding: 10px 16px; font-size: 14px; font-weight: 600; color: var(--text-muted);
    border-bottom: 2px solid transparent; margin-bottom: -1px;
  }
  nav.tabs button.active { color: var(--text-primary); border-bottom-color: var(--text-primary); }

  .view { display: none; }
  .view.active { display: block; }

  .channels-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
  @media (max-width: 820px) { .channels-grid { grid-template-columns: 1fr; } }

  .card {
    background: var(--surface-1); border: 1px solid var(--border); border-radius: 12px;
    padding: 18px 20px;
  }
  .card + .card { margin-top: 18px; }
  .card-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
  .channel-name { display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 700; }
  .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
  .dot.official { background: var(--series-official); }
  .dot.amazon { background: var(--series-amazon); }

  select.period-select {
    font: inherit; font-size: 13px; padding: 5px 8px; border-radius: 6px;
    border: 1px solid var(--border); background: var(--surface-1); color: var(--text-primary);
  }

  .stat-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 10px; margin-bottom: 14px; }
  .stat-tile { padding: 10px 0; }
  .stat-label { font-size: 12px; color: var(--text-muted); margin-bottom: 4px; }
  .stat-value { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .stat-delta { font-size: 12px; margin-top: 3px; font-variant-numeric: tabular-nums; }
  .stat-delta.up { color: var(--good); }
  .stat-delta.down { color: var(--critical); }
  .stat-delta.flat { color: var(--text-muted); }
  .stat-value.good { color: var(--good); }
  .stat-value.warning { color: var(--warning); }
  .stat-value.critical { color: var(--critical); }

  table.prod-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  table.prod-table caption { text-align: left; font-size: 12px; color: var(--text-muted); margin-bottom: 6px; }
  table.prod-table th, table.prod-table td { padding: 6px 8px; text-align: right; border-bottom: 1px solid var(--grid); }
  table.prod-table th:first-child, table.prod-table td:first-child { text-align: left; }
  table.prod-table thead th { color: var(--text-muted); font-weight: 600; font-size: 12px; }
  table.prod-table td.num, table.prod-table th.num { font-variant-numeric: tabular-nums; }
  table.prod-table tbody tr:last-child td { border-bottom: none; }

  .chart-wrap { margin-top: 4px; }
  .chart-wrap svg { width: 100%; height: auto; display: block; overflow: visible; }
  .bar { transition: opacity 0.1s; cursor: pointer; }
  .bar:hover { opacity: 0.75; }
  .axis-label { font-size: 10px; fill: var(--text-muted); }
  .value-label { font-size: 10px; fill: var(--text-secondary); font-variant-numeric: tabular-nums; }
  .gridline { stroke: var(--grid); stroke-width: 1; }

  .tooltip {
    position: fixed; pointer-events: none; z-index: 50;
    background: var(--text-primary); color: var(--page);
    font-size: 12px; padding: 6px 9px; border-radius: 6px; line-height: 1.5;
    box-shadow: 0 4px 14px rgba(0,0,0,0.2);
    opacity: 0; transform: translate(-50%, -100%); transition: opacity 0.08s;
    white-space: nowrap;
  }
  .tooltip.show { opacity: 1; }

  .badge { display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 999px; border: 1px solid var(--border); color: var(--text-muted); margin-left: 8px; }
  .badge.provisional { color: var(--critical); border-color: var(--critical); }

  .foot-note { color: var(--text-muted); font-size: 12px; margin-top: 28px; line-height: 1.7; }

  /* ---- 頂部KPI：目標/實際/達成率 ---- */
  .hero { margin-bottom: 22px; }
  .hero-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }
  @media (max-width: 720px) { .hero-grid { grid-template-columns: 1fr; } }
  .hero-tile-label { font-size: 12px; color: var(--text-muted); margin-bottom: 6px; }
  .hero-tile-value { font-size: 30px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.15; }
  .hero-tile-sub { font-size: 12px; color: var(--text-muted); margin-top: 4px; }
  .hero-tile-value.muted { font-size: 18px; color: var(--text-muted); font-weight: 600; }
  .hero-tile-value.good { color: var(--good); }
  .hero-tile-value.warning { color: var(--warning); }
  .hero-tile-value.critical { color: var(--critical); }
  .progress-track { height: 8px; border-radius: 999px; background: var(--grid); margin-top: 10px; overflow: hidden; }
  .progress-fill { height: 100%; border-radius: 999px; }
  .progress-fill.good { background: var(--good); }
  .progress-fill.warning { background: var(--warning); }
  .progress-fill.critical { background: var(--critical); }
  .hero-period { font-size: 13px; color: var(--text-secondary); margin-bottom: 12px; }

  /* ---- 分類/品項兩層明細表 ---- */
  table.cat-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  table.cat-table caption { text-align: left; font-size: 12px; color: var(--text-muted); margin-bottom: 6px; }
  table.cat-table th, table.cat-table td { padding: 7px 8px; text-align: right; border-bottom: 1px solid var(--grid); }
  table.cat-table th:first-child, table.cat-table td:first-child { text-align: left; }
  table.cat-table thead th { color: var(--text-muted); font-weight: 600; font-size: 12px; }
  table.cat-table td.num, table.cat-table th.num { font-variant-numeric: tabular-nums; }
  table.cat-table tbody tr:last-child td { border-bottom: none; }
  tr.cat-row { cursor: pointer; font-weight: 700; }
  tr.cat-row:hover { background: var(--page); }
  tr.cat-row .caret { display: inline-block; width: 12px; transition: transform 0.1s; color: var(--text-muted); }
  tr.cat-row.open .caret { transform: rotate(90deg); }
  tr.sku-row { display: none; font-weight: 400; color: var(--text-secondary); }
  tr.sku-row.open { display: table-row; }
  tr.sku-row td:first-child { padding-left: 26px; }

  /* ---- 庫存戰情表 ---- */
  table.inv-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  table.inv-table th, table.inv-table td { padding: 7px 8px; text-align: right; border-bottom: 1px solid var(--grid); }
  table.inv-table th:first-child, table.inv-table td:first-child { text-align: left; }
  table.inv-table thead th { color: var(--text-muted); font-weight: 600; font-size: 12px; }
  table.inv-table td.num, table.inv-table th.num { font-variant-numeric: tabular-nums; }
  table.inv-table tbody tr:last-child td { border-bottom: none; }
  .inv-badge { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 999px; }
  .inv-badge.critical { color: var(--critical); background: color-mix(in srgb, var(--critical) 14%, transparent); }
  .inv-badge.warning { color: var(--warning); background: color-mix(in srgb, var(--warning) 16%, transparent); }
  .inv-badge.good { color: var(--good); background: color-mix(in srgb, var(--good) 12%, transparent); }
  .inv-badge.na { color: var(--text-muted); background: var(--page); }
  .inv-alert-banner { display: flex; align-items: flex-start; gap: 8px; background: color-mix(in srgb, var(--critical) 10%, transparent); border: 1px solid color-mix(in srgb, var(--critical) 35%, transparent); border-radius: 10px; padding: 10px 14px; font-size: 13px; margin-bottom: 16px; }
  .inv-alert-banner b { color: var(--critical); }
</style>

<script>
(function () {
  const CH = [
    { key: "官網", label: "官網", color: "var(--series-official)", fill: "var(--series-official-fill)", dotClass: "official" },
    { key: "Amazon", label: "Amazon(美國站)", color: "var(--series-amazon)", fill: "var(--series-amazon-fill)", dotClass: "amazon" },
  ];

  const fmtUSD = (n) => "US$" + Math.round(n).toLocaleString("en-US");
  const fmtNum = (n) => Math.round(n).toLocaleString("en-US");
  const tooltip = document.getElementById("tooltip");

  function showTip(evt, html) {
    tooltip.innerHTML = html;
    tooltip.style.left = evt.clientX + "px";
    tooltip.style.top = (evt.clientY - 10) + "px";
    tooltip.classList.add("show");
  }
  function hideTip() { tooltip.classList.remove("show"); }

  // ---------- 小工具：長條圖（週期/月份 x 營收）----------
  function renderBarChart(points, opts) {
    // points: [{label, value, provisional, target}]
    const w = 520, h = 150, padL = 4, padR = 4, padT = 10, padB = 20;
    const innerW = w - padL - padR, innerH = h - padT - padB;
    const max = Math.max(1, ...points.map((p) => p.value), ...points.map((p) => p.target || 0));
    const n = points.length;
    const gap = 6;
    const barW = n > 0 ? (innerW - gap * (n - 1)) / n : innerW;
    const hasAnyTarget = points.some((p) => p.target != null);

    let bars = "";
    let labels = "";
    let targetTicks = "";
    points.forEach((p, i) => {
      const x = padL + i * (barW + gap);
      const barH = max > 0 ? (p.value / max) * innerH : 0;
      const y = padT + innerH - barH;
      const fill = p.provisional ? opts.fill : opts.color;
      bars += `<rect class="bar" data-i="${i}" x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${barW.toFixed(1)}" height="${Math.max(1, barH).toFixed(1)}" rx="3" fill="${fill}" stroke="${opts.color}" stroke-width="${p.provisional ? 1 : 0}" stroke-dasharray="${p.provisional ? "2,2" : "0"}"></rect>`;
      if (p.target != null) {
        const ty = padT + innerH - (p.target / max) * innerH;
        // 目標線畫成一條跨過該柱子的深色刻度，柱頂超過刻度=達標，方便一眼比對，不用切換數字
        targetTicks += `<line x1="${x.toFixed(1)}" y1="${ty.toFixed(1)}" x2="${(x + barW).toFixed(1)}" y2="${ty.toFixed(1)}" stroke="var(--text-primary)" stroke-width="2"></line>`;
      }
      if (n <= 14 || i % Math.ceil(n / 14) === 0) {
        labels += `<text class="axis-label" x="${(x + barW / 2).toFixed(1)}" y="${h - 5}" text-anchor="middle">${p.shortLabel || p.label}</text>`;
      }
    });

    const svg = `<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="${opts.title || ""}">
      <line class="gridline" x1="${padL}" y1="${padT + innerH}" x2="${padL + innerW}" y2="${padT + innerH}"></line>
      ${bars}
      ${targetTicks}
      ${labels}
    </svg>`;

    const div = document.createElement("div");
    div.className = "chart-wrap";
    div.innerHTML = svg;
    if (hasAnyTarget) {
      const legend = document.createElement("div");
      legend.style.cssText = "font-size:11px;color:var(--text-muted);margin-top:2px;";
      legend.innerHTML = `<span style="display:inline-block;width:14px;height:2px;background:var(--text-primary);vertical-align:middle;margin-right:4px;"></span>目標線(推算)`;
      div.appendChild(legend);
    }
    const svgEl = div.querySelector("svg");
    svgEl.querySelectorAll(".bar").forEach((rect, i) => {
      const p = points[i];
      const targetLine = p.target != null ? `<br>目標(推算): ${opts.fmt(p.target)}` : "";
      rect.addEventListener("mousemove", (evt) => {
        showTip(evt, `<b>${p.label}</b><br>${opts.metric}: ${opts.fmt(p.value)}${targetLine}${p.provisional ? "<br><i>暫估，尚未結算</i>" : ""}`);
      });
      rect.addEventListener("mouseleave", hideTip);
    });
    return div;
  }

  // 主力產品/大幅變動品項：跟上一期比，哪個分類漲最多、哪個跌最多，一眼看出這期是誰在拉業績/扯後腿。
  // 門檻設 $50 以上的變動才顯示，避免小分類的雜訊被當成「大幅變動」。
  function topMoverHtml(byCategory, prevByCategory) {
    if (!prevByCategory) return "";
    const cats = new Set([...Object.keys(byCategory || {}), ...Object.keys(prevByCategory || {})]);
    const diffs = [...cats].map((cat) => {
      const curr = (byCategory && byCategory[cat] && byCategory[cat].revenue) || 0;
      const prev = (prevByCategory[cat] && prevByCategory[cat].revenue) || 0;
      return { cat, curr, prev, diff: curr - prev };
    }).filter((d) => Math.abs(d.diff) >= 50);
    if (diffs.length === 0) return "";
    diffs.sort((a, b) => b.diff - a.diff);
    const top = diffs[0];
    const bottom = diffs[diffs.length - 1];
    const parts = [];
    if (top && top.diff > 0) parts.push(`<span style="color:var(--good)">▲ ${top.cat}</span> 較上期多賣 US$${fmtNum(top.diff)}`);
    if (bottom && bottom.diff < 0 && bottom.cat !== top.cat) parts.push(`<span style="color:var(--critical)">▼ ${bottom.cat}</span> 較上期少賣 US$${fmtNum(Math.abs(bottom.diff))}`);
    if (parts.length === 0) return "";
    return `<div style="font-size:13px;color:var(--text-secondary);margin:-4px 0 14px;">📌 ${parts.join("　")}</div>`;
  }

  // 週目標是用月目標按天數/歷史通路佔比推算的參考值，標籤加「推算」避免被誤會成官方訂的個別目標
  function targetTile(p) {
    if (p.targetUSD == null) return "";
    const rate = p.achievementRate;
    const cls = rate >= 100 ? "good" : rate >= 80 ? "warning" : "critical";
    return `<div class="stat-tile">
      <div class="stat-label">本期目標達成率(推算)</div>
      <div class="stat-value ${cls}" style="font-size:22px;">${rate.toFixed(1)}%</div>
      <div class="progress-track"><div class="progress-fill ${cls}" style="width:${Math.min(100, rate)}%"></div></div>
    </div>`;
  }

  function deltaEl(curr, prev) {
    if (prev == null || prev === 0) return `<div class="stat-delta flat">—</div>`;
    const pct = ((curr - prev) / prev) * 100;
    const cls = pct > 0.5 ? "up" : pct < -0.5 ? "down" : "flat";
    const sign = pct > 0 ? "▲" : pct < 0 ? "▼" : "•";
    return `<div class="stat-delta ${cls}">${sign} ${Math.abs(pct).toFixed(1)}% 較上期</div>`;
  }

  // 兩層表：分類(粗體，點了展開/收合) + 底下該分類的SKU明細。
  // 分類對應 sherriva.com 官網選單分類，是業務平常講的語言；SKU 是給想深入看的人用的。
  function categoryTable(byCategory, byProduct, opts) {
    const catRows = Object.entries(byCategory || {})
      .filter(([, v]) => v.qty || v.revenue)
      .sort((a, b) => b[1].revenue - a[1].revenue);
    if (catRows.length === 0) return `<div style="color:var(--text-muted);font-size:13px;">（此期無明細）</div>`;

    const groups = opts.productGroups || {};
    const skuByCategory = {};
    for (const [sku, v] of Object.entries(byProduct || {})) {
      const cat = groups[sku] || "未分類";
      if (!skuByCategory[cat]) skuByCategory[cat] = [];
      skuByCategory[cat].push([sku, v]);
    }

    let html = `<table class="cat-table">
      <caption>${opts.caption}（點分類可展開細項）</caption>
      <thead><tr><th>分類</th><th class="num">數量</th><th class="num">金額</th></tr></thead>
      <tbody>`;
    catRows.forEach(([cat, v], i) => {
      const skus = (skuByCategory[cat] || []).sort((a, b) => b[1].revenue - a[1].revenue);
      html += `<tr class="cat-row" data-cat-idx="${i}"><td><span class="caret">▸</span>${cat}</td><td class="num">${fmtNum(v.qty)}</td><td class="num">${opts.moneyFmt(v.revenue)}</td></tr>`;
      skus.forEach(([sku, sv]) => {
        html += `<tr class="sku-row" data-cat-idx="${i}"><td>${sku}</td><td class="num">${fmtNum(sv.qty)}</td><td class="num">${opts.moneyFmt(sv.revenue)}</td></tr>`;
      });
    });
    html += `</tbody></table>`;
    return html;
  }

  function wireCategoryTable(container) {
    const table = container.querySelector("table.cat-table");
    if (!table) return;
    table.querySelectorAll("tr.cat-row").forEach((row) => {
      row.addEventListener("click", () => {
        const idx = row.dataset.catIdx;
        const open = row.classList.toggle("open");
        table.querySelectorAll(`tr.sku-row[data-cat-idx="${idx}"]`).forEach((sr) => sr.classList.toggle("open", open));
      });
    });
  }

  // ---------- 週報 ----------
  function buildWeeklyCard(chDef) {
    const periods = DATA.periods.filter((p) => p.channel === chDef.key).sort((a, b) => a.startDate.localeCompare(b.startDate));
    const card = document.createElement("div");
    card.className = "card";
    if (periods.length === 0) {
      card.innerHTML = `<div class="channel-name"><span class="dot ${chDef.dotClass}"></span>${chDef.label}</div><div style="color:var(--text-muted)">尚無資料</div>`;
      return card;
    }
    const head = document.createElement("div");
    head.className = "card-head";
    head.innerHTML = `<div class="channel-name"><span class="dot ${chDef.dotClass}"></span>${chDef.label}</div>
      <select class="period-select"></select>`;
    card.appendChild(head);

    const select = head.querySelector("select");
    periods.forEach((p, i) => {
      const opt = document.createElement("option");
      opt.value = i;
      opt.textContent = p.label + (p.month === maxMonth(periods) && i === periods.length - 1 ? "（最新）" : "");
      select.appendChild(opt);
    });
    select.value = periods.length - 1;

    const body = document.createElement("div");
    card.appendChild(body);

    function render() {
      const idx = +select.value;
      const p = periods[idx];
      const prev = periods[idx - 1];
      const moneyFmt = chDef.key === "Amazon" ? (v) => fmtUSD(v) + " (US)" : fmtUSD;

      let extraRegion = "";
      if (chDef.key === "Amazon" && p.byRegion) {
        const others = Object.entries(p.byRegion).filter(([r]) => r !== "USA");
        if (others.length) {
          extraRegion = `<div style="font-size:12px;color:var(--text-muted);margin-top:-6px;margin-bottom:14px;">
            其他站點數量：${others.map(([r, v]) => `${r} ${fmtNum(v.qty)}件`).join("　")}（金額未併入，幣別非USD）
          </div>`;
        }
      }

      body.innerHTML = `
        <div style="font-size:13px;color:var(--text-muted);margin-bottom:10px;">${p.startDate} ~ ${p.endDate}　來源：${p.source}</div>
        <div class="stat-row">
          <div class="stat-tile">
            <div class="stat-label">銷售額</div>
            <div class="stat-value">${moneyFmt(p.totalRevenueUSD)}</div>
            ${deltaEl(p.totalRevenueUSD, prev && prev.totalRevenueUSD)}
          </div>
          <div class="stat-tile">
            <div class="stat-label">銷售數量</div>
            <div class="stat-value">${fmtNum(p.totalUnits)}</div>
            ${deltaEl(p.totalUnits, prev && prev.totalUnits)}
          </div>
          <div class="stat-tile">
            <div class="stat-label">${chDef.key === "官網" ? "訂單數" : "區間"}</div>
            <div class="stat-value">${chDef.key === "官網" ? fmtNum(p.ordersCount) : p.label}</div>
          </div>
          ${targetTile(p)}
        </div>
        ${extraRegion}
        ${topMoverHtml(p.byCategory, prev && prev.byCategory)}
      `;

      const chartData = periods.map((pp) => ({
        label: pp.label,
        shortLabel: pp.label.split("-")[0],
        value: pp.totalRevenueUSD,
        target: pp.targetUSD,
      }));
      const chartWrap = renderBarChart(chartData, {
        color: chDef.color, fill: chDef.fill, metric: "銷售額", fmt: moneyFmt, title: chDef.label + " 各期銷售額",
      });
      const oldChart = body.querySelector(".chart-wrap");
      if (oldChart) oldChart.remove();
      body.appendChild(chartWrap);

      const tableWrap = document.createElement("div");
      tableWrap.style.marginTop = "16px";
      tableWrap.innerHTML = categoryTable(p.byCategory, p.byProduct, { caption: "本期產品明細", moneyFmt, productGroups: DATA.meta.productGroups });
      const oldTable = body.querySelector("table.cat-table");
      if (oldTable) oldTable.closest("div").remove();
      body.appendChild(tableWrap);
      wireCategoryTable(tableWrap);
    }
    select.addEventListener("change", render);
    render();
    return card;
  }

  function maxMonth(periods) {
    return Math.max(...periods.map((p) => p.month));
  }

  // ---------- 月報 ----------
  function buildMonthlyCard(chDef) {
    const months = DATA.monthly.filter((m) => m.channel === chDef.key).sort((a, b) => a.year - b.year || a.month - b.month);
    const card = document.createElement("div");
    card.className = "card";
    if (months.length === 0) {
      card.innerHTML = `<div class="channel-name"><span class="dot ${chDef.dotClass}"></span>${chDef.label}</div><div style="color:var(--text-muted)">尚無資料</div>`;
      return card;
    }
    const head = document.createElement("div");
    head.className = "card-head";
    head.innerHTML = `<div class="channel-name"><span class="dot ${chDef.dotClass}"></span>${chDef.label}</div>
      <select class="period-select"></select>`;
    card.appendChild(head);

    const select = head.querySelector("select");
    months.forEach((m, i) => {
      const provisional = /暫估/.test(m.source);
      const opt = document.createElement("option");
      opt.value = i;
      opt.textContent = `${m.year}年${m.month}月` + (provisional ? "（暫估）" : "");
      select.appendChild(opt);
    });
    select.value = months.length - 1;

    const body = document.createElement("div");
    card.appendChild(body);

    function render() {
      const idx = +select.value;
      const m = months[idx];
      const prev = months[idx - 1];
      const moneyFmt = chDef.key === "Amazon" ? (v) => fmtUSD(v) + " (US)" : fmtUSD;
      const provisional = /暫估/.test(m.source);

      body.innerHTML = `
        <div style="font-size:13px;color:var(--text-muted);margin-bottom:10px;">
          ${m.year}年${m.month}月　來源：${m.source}
          ${provisional ? `<span class="badge provisional">尚未結算</span>` : `<span class="badge">財務已結算</span>`}
        </div>
        <div class="stat-row">
          <div class="stat-tile">
            <div class="stat-label">月銷售額</div>
            <div class="stat-value">${moneyFmt(m.totalRevenueUSD)}</div>
            ${deltaEl(m.totalRevenueUSD, prev && prev.totalRevenueUSD)}
          </div>
          ${targetTile(m)}
        </div>
      `;

      const chartData = months.map((mm) => ({
        label: `${mm.year}/${mm.month}`,
        shortLabel: mm.month + "月",
        value: mm.totalRevenueUSD,
        target: mm.targetUSD,
        provisional: /暫估/.test(mm.source),
      }));
      const chartWrap = renderBarChart(chartData, {
        color: chDef.color, fill: chDef.fill, metric: "月銷售額", fmt: moneyFmt, title: chDef.label + " 月銷售額趨勢",
      });
      body.appendChild(chartWrap);

      const oldTable = body.querySelector("table.cat-table");
      if (oldTable) oldTable.closest("div").remove();
      const tableWrap = document.createElement("div");
      tableWrap.style.marginTop = "16px";
      tableWrap.innerHTML = categoryTable(m.byCategory, m.byProduct, { caption: "本月產品明細", moneyFmt, productGroups: DATA.meta.productGroups });
      body.appendChild(tableWrap);
      wireCategoryTable(tableWrap);
    }
    select.addEventListener("change", render);
    render();
    return card;
  }

  // ---------- 頂部KPI：整體業績目標/實際/達成率 ----------
  function buildHero() {
    const hero = document.getElementById("hero");
    const company = (DATA.company || []).slice().sort((a, b) => a.year - b.year || a.month - b.month);
    if (company.length === 0) {
      hero.style.display = "none";
      return;
    }
    const latest = company[company.length - 1];
    const provisional = /暫估/.test(latest.source);
    const hasTarget = typeof latest.targetUSD === "number" && latest.targetUSD > 0;
    const rate = latest.achievementRate;
    const rateClass = !hasTarget ? "" : rate >= 100 ? "good" : rate >= 80 ? "warning" : "critical";

    // 進度提醒：只在「當月還沒結束(暫估)」時算，用兩通路目前最新一期的結束日當作「做到哪一天」，
    // 算出剩下幾天、平均每天還要做到多少才能追上月目標——這是給業務看了能馬上知道要不要加把勁的提示，
    // 不是精算，畢竟官網/Amazon 兩邊資料進度可能不同天。
    let paceHtml = "";
    if (provisional && hasTarget) {
      const inMonth = (DATA.periods || []).filter((p) => p.year === latest.year && p.month === latest.month);
      if (inMonth.length > 0) {
        const asOfDate = inMonth.reduce((max, p) => (p.endDate > max ? p.endDate : max), inMonth[0].endDate);
        const asOfDay = Number(asOfDate.slice(-2));
        const daysInMonth = new Date(latest.year, latest.month, 0).getDate();
        const daysRemaining = daysInMonth - asOfDay;
        const remainingTarget = latest.targetUSD - latest.totalRevenueUSD;
        if (remainingTarget <= 0) {
          paceHtml = `<div class="hero-tile-sub" style="margin-top:10px;">✓ 已經達成本月目標(以推算資料計)</div>`;
        } else if (daysRemaining > 0) {
          const perDay = remainingTarget / daysRemaining;
          paceHtml = `<div class="hero-tile-sub" style="margin-top:10px;">
            資料做到 ${asOfDate}(還剩 ${daysRemaining} 天)：要追上本月目標，平均每天還要做到 <b style="color:var(--text-primary)">${fmtUSD(perDay)}</b>
            （約每週 ${fmtUSD(perDay * 7)}）
          </div>`;
        } else {
          paceHtml = `<div class="hero-tile-sub" style="margin-top:10px;">本月天數已到，還差 ${fmtUSD(remainingTarget)} 未達標，待財務結算確認</div>`;
        }
      }
    }

    hero.innerHTML = `
      <div class="hero-period">${latest.year}年${latest.month}月　官網＋Amazon合計　來源：${latest.source}${provisional ? ' <span class="badge provisional">尚未結算</span>' : ' <span class="badge">財務已結算</span>'}</div>
      <div class="hero-grid">
        <div>
          <div class="hero-tile-label">業績目標</div>
          <div class="hero-tile-value ${hasTarget ? "" : "muted"}">${hasTarget ? fmtUSD(latest.targetUSD) : "尚未設定目標"}</div>
          ${hasTarget ? "" : `<div class="hero-tile-sub">在 targets.json 填入 monthlyTargetUSD 就會顯示</div>`}
        </div>
        <div>
          <div class="hero-tile-label">實際業績（官網＋Amazon）</div>
          <div class="hero-tile-value">${fmtUSD(latest.totalRevenueUSD)}</div>
        </div>
        <div>
          <div class="hero-tile-label">達成率</div>
          <div class="hero-tile-value ${hasTarget ? rateClass : "muted"}">${hasTarget ? rate.toFixed(1) + "%" : "—"}</div>
          ${hasTarget ? `<div class="progress-track"><div class="progress-fill ${rateClass}" style="width:${Math.min(100, rate)}%"></div></div>` : ""}
        </div>
      </div>
      ${paceHtml}
      ${inventoryAlertBannerHtml()}
    `;
  }

  // ---------- 庫存戰情 ----------
  // 庫存快照是手動/定期下載的，不是每次網頁更新都同步，時間點要清楚標出來避免業務誤會是即時庫存。
  function inventoryStatus(item) {
    if (!item.monthlyAvgSales) return { cls: "na", label: "近3月無銷量" };
    if (item.stockoutDaysThisMonth > 0 || (item.daysOfSupply != null && item.daysOfSupply < 14)) {
      return { cls: "critical", label: "缺貨風險" };
    }
    if (item.daysOfSupply != null && item.daysOfSupply < 30) return { cls: "warning", label: "庫存偏低" };
    return { cls: "good", label: "庫存充足" };
  }

  function inventoryAlertBannerHtml() {
    const items = DATA.inventory || [];
    if (items.length === 0) return "";
    const critical = items.filter((i) => inventoryStatus(i).cls === "critical");
    if (critical.length === 0) return "";
    const names = critical
      .slice()
      .sort((a, b) => (a.daysOfSupply ?? 0) - (b.daysOfSupply ?? 0))
      .map((i) => `${i.sku}(剩${i.daysOfSupply != null ? i.daysOfSupply + "天" : "0"}${i.stockoutDaysThisMonth > 0 ? `，本月已缺貨${i.stockoutDaysThisMonth}天` : ""})`)
      .join("、");
    return `<div class="inv-alert-banner" style="margin-top:14px;">
      <span>⚠</span>
      <span><b>${critical.length} 個品項有缺貨風險：</b>${names}　<span style="color:var(--text-muted)">(詳見「庫存戰情」分頁)</span></span>
    </div>`;
  }

  function buildInventoryTab() {
    const container = document.getElementById("inventoryCard");
    const items = (DATA.inventory || []).slice();
    if (items.length === 0) {
      container.innerHTML = `<div style="color:var(--text-muted)">尚無庫存快照資料</div>`;
      return;
    }
    items.sort((a, b) => {
      const ra = inventoryStatus(a).cls, rb = inventoryStatus(b).cls;
      const order = { critical: 0, warning: 1, good: 2, na: 3 };
      if (order[ra] !== order[rb]) return order[ra] - order[rb];
      return (a.daysOfSupply ?? 99999) - (b.daysOfSupply ?? 99999);
    });
    const snapshotAt = DATA.inventorySnapshotAt ? new Date(DATA.inventorySnapshotAt).toLocaleString("zh-TW", { hour12: false }) : "未知";
    container.innerHTML = `
      <div style="font-size:13px;color:var(--text-muted);margin-bottom:14px;">
        庫存快照時間：${snapshotAt}（手動/定期從「Sherriva 庫銷管理表」下載，不是即時庫存，請留意快照時間）
      </div>
      <table class="inv-table">
        <thead><tr>
          <th>分類</th><th>SKU</th><th class="num">目前庫存</th><th class="num">本月斷貨天數</th>
          <th class="num">可撐天數</th><th class="num">在途數量</th><th>預計到港</th><th>狀態</th>
        </tr></thead>
        <tbody>
          ${items.map((i) => {
            const st = inventoryStatus(i);
            return `<tr>
              <td>${i.category}</td>
              <td>${i.sku}</td>
              <td class="num">${fmtNum(i.currentStock)}</td>
              <td class="num">${i.stockoutDaysThisMonth > 0 ? `<b style="color:var(--critical)">${i.stockoutDaysThisMonth}</b>` : "0"}</td>
              <td class="num">${i.daysOfSupply != null ? i.daysOfSupply.toFixed(1) : "—"}</td>
              <td class="num">${fmtNum(i.inTransitTotal)}</td>
              <td>${i.etaDate || "—"}</td>
              <td><span class="inv-badge ${st.cls}">${st.label}</span></td>
            </tr>`;
          }).join("")}
        </tbody>
      </table>
    `;
  }

  // ---------- 組裝頁面 ----------
  buildHero();
  buildInventoryTab();
  const weeklyGrid = document.getElementById("weeklyGrid");
  CH.forEach((c) => weeklyGrid.appendChild(buildWeeklyCard(c)));

  const monthlyGrid = document.getElementById("monthlyGrid");
  CH.forEach((c) => monthlyGrid.appendChild(buildMonthlyCard(c)));

  document.querySelectorAll("nav.tabs button").forEach((btn) => {
    btn.addEventListener("click", () => {
      document.querySelectorAll("nav.tabs button").forEach((b) => b.classList.remove("active"));
      btn.classList.add("active");
      document.querySelectorAll(".view").forEach((v) => v.classList.remove("active"));
      document.getElementById("view-" + btn.dataset.view).classList.add("active");
    });
  });

  const updated = new Date(DATA.generatedAt);
  document.getElementById("updatedAt").textContent = "資料更新時間：" + updated.toLocaleString("zh-TW", { hour12: false });

  document.getElementById("footNote").innerHTML = `
    產品分類(HDMI分配/切換、無線傳輸、電視天線、HDMI線材)對應 sherriva.com 官網選單分類；SKU 明細比對不到分類的歸入「未分類」。
    官網訂單金額以訂單編號去重計算；已取消/全額退款訂單不列入。
    週期資料涵蓋範圍請見各期「來源」檔名；4月初(官網4/11前、Amazon 4/13前)無存檔故未列入。
    頂部「整體業績」取財務結算後的「表1 全公司業績」(官網+Amazon已合計)；業績目標來自公司「2026年目標」表(Sherriva列，萬元台幣換算)。
    週報卡片的「本期目標達成率」是把月目標按天數、以及官網/Amazon歷史營收佔比拆算出來的推算值，不是管理層另外訂的官網/Amazon個別目標，僅供參考抓感覺，正式檢討仍以月報為準。
  `;
})();
</script>
</body>
</html>
