    /* 品牌色：直接取自 sherriva.com 官網跟公司信頭紙（黑 #121212、招牌金黃 #FACA00）。
       官網的按鈕/徽章只用小面積的黑黃，但信頭紙本身有大塊金黃色條(配一條黑色細底線)，
       所以圖表這種本來就該用色塊表示數值的地方，直接用招牌金黃沒問題；
       KPI卡片這種本文字為主的地方，還是維持白底黑字放大，只用金黃當細框/底線。 */
    --brand-yellow:      #FACA00;
    --brand-black:       #121212;
    --page:           #f8f7f3;
    --surface-1:      #ffffff;
    --surface-2:      #f2f1ea;
    --text-primary:   #121212;
    --text-secondary: #55534c;
    --text-muted:     #918f85;
    --grid:           #e7e5db;
    --axis:           #d2d0c3;
    --border:         rgba(18,18,18,0.10);
    --good:           #1f8f4e;
    --warning:        #b9790a;
    --critical:       #cf3131;
    --good-fill:      rgba(31,143,78,0.10);
    --warning-fill:   rgba(185,121,10,0.12);
    --critical-fill:  rgba(207,49,49,0.10);
    --series-official: #FACA00; /* 官網：品牌招牌金黃，跟公司信頭紙上那條色塊同一個顏色 */
    --series-amazon:   #6b6862; /* Amazon：中性深灰褐，跟金黃區分開 */
    --series-official-fill: rgba(250,202,0,0.45);
    --series-amazon-fill:   rgba(107,104,98,0.30);
    --cat-hdmi:      #1f6fb2;
    --cat-wireless:  #6b3fa0;
    --cat-antenna:   #1f8f4e;
    --cat-cable:     #b9790a;
    --cat-other:     #918f85;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--page);
    color: var(--text-primary);
    font-family: system-ui, -apple-system, "Segoe UI", "PingFang TC", "Microsoft JhengHei", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 1220px; margin: 0 auto; padding: 28px 20px 80px; }
  header.top { display: flex; align-items: baseline; justify-content: space-between; flex-wrap: wrap; gap: 8px; margin-bottom: 6px; }
  h1 { font-size: 24px; font-weight: 800; margin: 0; letter-spacing: 0.2px; }
  .updated { color: var(--text-muted); font-size: 13px; }
  .subnote { color: var(--text-secondary); font-size: 13px; margin: 4px 0 20px; line-height: 1.6; }
  .subnote b { color: var(--text-primary); }

  nav.tabs { display: flex; gap: 6px; margin-bottom: 22px; flex-wrap: wrap; }
  nav.tabs button {
    appearance: none; border: 1px solid var(--border); background: var(--surface-1); cursor: pointer;
    padding: 10px 18px; font-size: 14px; font-weight: 700; color: var(--text-secondary);
    border-radius: 999px; transition: all 0.12s;
  }
  nav.tabs button:hover { color: var(--text-primary); border-color: var(--brand-black); }
  nav.tabs button.active { color: #ffffff; background: var(--brand-black); border-color: var(--brand-black); }

  .view { display: none; }
  .view.active { display: block; }

  .channels-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
  @media (max-width: 820px) { .channels-grid { grid-template-columns: 1fr; } }

  .card {
    background: var(--surface-1); border: 1px solid var(--border); border-radius: 16px;
    padding: 20px 22px; box-shadow: 0 10px 30px -18px rgba(0,0,0,0.6);
    border-top: 3px solid var(--card-accent, var(--axis));
  }
  .card + .card { margin-top: 18px; }
  .card-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
  .channel-name { display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 800; }
  .channel-icon { font-size: 18px; line-height: 1; }
  .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
  .dot.official { background: var(--series-official); }
  .dot.amazon { background: var(--series-amazon); }

  select.period-select {
    font: inherit; font-size: 13px; padding: 6px 10px; border-radius: 8px;
    border: 1px solid var(--border); background: var(--surface-2); color: var(--text-primary);
  }

  /* 重點數字放大凸顯，但不用色塊底——sherriva.com 本身沒有大色塊，金黃/黑只用在
     小按鈕跟徽章上；這裡改成白底 + 細線上邊框(色條) + 加大加粗數字。 */
  .stat-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 12px; margin-bottom: 16px; }
  .stat-tile {
    padding: 12px 14px; border-radius: 10px;
    background: var(--surface-1);
    border: 1px solid var(--border);
    border-top: 3px solid var(--tile-accent, var(--axis));
  }
  .stat-label { font-size: 12px; color: var(--text-muted); margin-bottom: 6px; font-weight: 700; }
  .stat-value { font-size: 28px; font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: -0.3px; color: var(--tile-value-color, var(--text-primary)); }
  .stat-delta { font-size: 12px; margin-top: 5px; font-variant-numeric: tabular-nums; font-weight: 700; }
  .stat-delta.up { color: var(--good); }
  .stat-delta.down { color: var(--critical); }
  .stat-delta.flat { color: var(--text-muted); }
  .stat-value.good { color: var(--good); }
  .stat-value.warning { color: var(--warning); }
  .stat-value.critical { color: var(--critical); }

  table.prod-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  table.prod-table caption { text-align: left; font-size: 12px; color: var(--text-muted); margin-bottom: 6px; }
  table.prod-table th, table.prod-table td { padding: 6px 8px; text-align: right; border-bottom: 1px solid var(--grid); }
  table.prod-table th:first-child, table.prod-table td:first-child { text-align: left; }
  table.prod-table thead th { color: var(--text-muted); font-weight: 600; font-size: 12px; }
  table.prod-table td.num, table.prod-table th.num { font-variant-numeric: tabular-nums; }
  table.prod-table tbody tr:last-child td { border-bottom: none; }

  .chart-wrap { margin-top: 4px; }
  .chart-wrap svg { width: 100%; height: auto; display: block; overflow: visible; }
  .bar { transition: opacity 0.1s; cursor: pointer; }
  .bar:hover { opacity: 0.75; }
  .axis-label { font-size: 10px; fill: var(--text-muted); }
  .value-label { font-size: 10px; fill: var(--text-secondary); font-variant-numeric: tabular-nums; }
  .gridline { stroke: var(--grid); stroke-width: 1; }

  .tooltip {
    position: fixed; pointer-events: none; z-index: 50;
    background: var(--text-primary); color: var(--page);
    font-size: 12px; padding: 6px 9px; border-radius: 6px; line-height: 1.5;
    box-shadow: 0 4px 14px rgba(0,0,0,0.2);
    opacity: 0; transform: translate(-50%, -100%); transition: opacity 0.08s;
    white-space: nowrap;
  }
  .tooltip.show { opacity: 1; }

  .badge { display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 999px; border: 1px solid var(--border); color: var(--text-muted); margin-left: 8px; }
  .badge.provisional { color: var(--critical); border-color: var(--critical); }

  /* ---- 頂部KPI：目標/實際/達成率 ---- */
  .hero { margin-bottom: 22px; border-top-color: var(--series-official); }
  .hero-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }
  @media (max-width: 720px) { .hero-grid { grid-template-columns: 1fr; } }
  .hero-tile { border-radius: 14px; padding: 18px 20px; background: var(--surface-1); border: 1px solid var(--border); border-top: 4px solid var(--tile-accent, var(--axis)); }
  .hero-tile-label { font-size: 13px; color: var(--text-muted); margin-bottom: 10px; font-weight: 700; display: flex; align-items: center; gap: 6px; }
  .hero-tile-value { font-size: 42px; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1.1; letter-spacing: -0.5px; color: var(--text-primary); }
  .hero-tile-sub { font-size: 12px; color: var(--text-muted); margin-top: 8px; }
  .hero-tile-value.muted { font-size: 20px; color: var(--text-muted); font-weight: 600; }
  .hero-tile-value.good { color: var(--good); }
  .hero-tile-value.warning { color: var(--warning); }
  .hero-tile-value.critical { color: var(--critical); }
  .progress-track { height: 8px; border-radius: 999px; background: var(--grid); margin-top: 12px; overflow: hidden; }
  .progress-fill { height: 100%; border-radius: 999px; }
  .progress-fill.good { background: var(--good); }
  .progress-fill.warning { background: var(--warning); }
  .progress-fill.critical { background: var(--critical); }
  .hero-period { font-size: 13px; color: var(--text-secondary); margin-bottom: 16px; font-weight: 600; }

  /* ---- 經營提醒(頁尾)：中性、低調，視覺層級低於所有銷售數據 ---- */
  #remindersCard { margin-top: 26px; }
  .reminders-title { font-size: 14px; font-weight: 800; margin-bottom: 8px; }
  .reminder-row { font-size: 13px; color: var(--text-secondary); padding: 5px 0; line-height: 1.6; }
  .reminder-empty { font-size: 13px; color: var(--text-muted); }
  .reminder-sub { font-size: 12px; color: var(--text-muted); margin-top: 12px; padding-top: 10px; border-top: 1px dashed var(--grid); line-height: 1.7; }

  /* ---- 分類/品項兩層明細表 ---- */
  table.cat-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  table.cat-table caption { text-align: left; font-size: 12px; color: var(--text-muted); margin-bottom: 6px; }
  table.cat-table th, table.cat-table td { padding: 7px 8px; text-align: right; border-bottom: 1px solid var(--grid); }
  table.cat-table th:first-child, table.cat-table td:first-child { text-align: left; }
  table.cat-table thead th { color: var(--text-muted); font-weight: 600; font-size: 12px; }
  table.cat-table td.num, table.cat-table th.num { font-variant-numeric: tabular-nums; }
  table.cat-table tbody tr:last-child td { border-bottom: none; }
  tr.cat-row { cursor: pointer; font-weight: 700; }
  tr.cat-row:hover { background: var(--page); }
  tr.cat-row .caret { display: inline-block; width: 12px; transition: transform 0.1s; color: var(--text-muted); }
  tr.cat-row.open .caret { transform: rotate(90deg); }
  tr.sku-row { display: none; font-weight: 400; color: var(--text-secondary); }
  tr.sku-row.open { display: table-row; }
  tr.sku-row td:first-child { padding-left: 26px; }
  .cat-icon { display: inline-block; width: 20px; text-align: center; margin-right: 4px; }
  .cat-dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 8px; }

  /* ---- 庫存戰情表 ---- */
  table.inv-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  table.inv-table th, table.inv-table td { padding: 9px 8px; text-align: right; border-bottom: 1px solid var(--grid); }
  table.inv-table th:first-child, table.inv-table td:first-child { text-align: left; }
  table.inv-table thead th { color: var(--text-muted); font-weight: 600; font-size: 12px; }
  table.inv-table td.num, table.inv-table th.num { font-variant-numeric: tabular-nums; }
  table.inv-table tbody tr:last-child td { border-bottom: none; }
  .inv-badge { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 700; padding: 4px 11px; border-radius: 999px; }
  .inv-badge.critical { color: var(--critical); background: var(--critical-fill); }
  .inv-badge.warning { color: var(--warning); background: var(--warning-fill); }
  .inv-badge.good { color: var(--good); background: var(--good-fill); }
  .inv-badge.na { color: var(--text-muted); background: var(--surface-2); }
  .inv-alert-banner { display: flex; align-items: flex-start; gap: 10px; background: var(--critical-fill); border: 1px solid color-mix(in srgb, var(--critical) 45%, transparent); border-radius: 12px; padding: 12px 16px; font-size: 13px; margin-bottom: 16px; }
  .inv-alert-banner b { color: var(--critical); }

  /* ---- 每週日銷售 ---- */
  .week-day-table td.today { color: var(--series-official); font-weight: 800; }
  .week-pill { display: inline-block; font-size: 11px; font-weight: 700; padding: 2px 9px; border-radius: 999px; background: var(--series-official-fill); color: var(--series-official); margin-left: 8px; }
</style>
</head>

<script>
(function () {
  const CH = [
    { key: "官網", label: "官網", icon: "🌐", color: "var(--series-official)", fill: "var(--series-official-fill)", dotClass: "official" },
    { key: "Amazon", label: "Amazon(美國站)", icon: "🛒", color: "var(--series-amazon)", fill: "var(--series-amazon-fill)", dotClass: "amazon" },
  ];

  // 4大分類的顏色/圖示，跟儀表板整體配色系統(HDMI=藍/無線=紫/天線=綠/線材=橘)一致，
  // 讓業務光看色塊、圖示就能認出是哪一類，不用逐字讀分類名稱。
  const CATEGORY_STYLE = {
    "HDMI分配/切換":     { icon: "🔀", color: "var(--cat-hdmi)" },
    "無線傳輸(WTR/WHD)": { icon: "📡", color: "var(--cat-wireless)" },
    "電視天線":          { icon: "📺", color: "var(--cat-antenna)" },
    "HDMI線材":          { icon: "🔌", color: "var(--cat-cable)" },
    "未分類":            { icon: "📦", color: "var(--cat-other)" },
  };
  function catStyle(cat) { return CATEGORY_STYLE[cat] || CATEGORY_STYLE["未分類"]; }

  const fmtUSD = (n) => "US$" + Math.round(n).toLocaleString("en-US");
  const fmtNum = (n) => Math.round(n).toLocaleString("en-US");
  const tooltip = document.getElementById("tooltip");

  function showTip(evt, html) {
    tooltip.innerHTML = html;
    tooltip.style.left = evt.clientX + "px";
    tooltip.style.top = (evt.clientY - 10) + "px";
    tooltip.classList.add("show");
  }
  function hideTip() { tooltip.classList.remove("show"); }

  // ---------- 小工具：長條圖（週期/月份 x 營收）----------
  function renderBarChart(points, opts) {
    // points: [{label, value, provisional, target}]
    const w = 520, h = 150, padL = 4, padR = 4, padT = 10, padB = 20;
    const innerW = w - padL - padR, innerH = h - padT - padB;
    const max = Math.max(1, ...points.map((p) => p.value), ...points.map((p) => p.target || 0));
    const n = points.length;
    const gap = 6;
    const barW = n > 0 ? (innerW - gap * (n - 1)) / n : innerW;
    const hasAnyTarget = points.some((p) => p.target != null);

    let bars = "";
    let labels = "";
    let targetTicks = "";
    points.forEach((p, i) => {
      const x = padL + i * (barW + gap);
      const barH = max > 0 ? (p.value / max) * innerH : 0;
      const y = padT + innerH - barH;
      const fill = p.provisional ? opts.fill : opts.color;
      bars += `<rect class="bar" data-i="${i}" x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${barW.toFixed(1)}" height="${Math.max(1, barH).toFixed(1)}" rx="3" fill="${fill}" stroke="${opts.color}" stroke-width="${p.provisional ? 1 : 0}" stroke-dasharray="${p.provisional ? "2,2" : "0"}"></rect>`;
      if (p.target != null) {
        const ty = padT + innerH - (p.target / max) * innerH;
        // 目標線畫成一條跨過該柱子的深色刻度，柱頂超過刻度=達標，方便一眼比對，不用切換數字
        targetTicks += `<line x1="${x.toFixed(1)}" y1="${ty.toFixed(1)}" x2="${(x + barW).toFixed(1)}" y2="${ty.toFixed(1)}" stroke="var(--brand-black)" stroke-width="3"></line>`;
      }
      if (n <= 14 || i % Math.ceil(n / 14) === 0) {
        labels += `<text class="axis-label" x="${(x + barW / 2).toFixed(1)}" y="${h - 5}" text-anchor="middle">${p.shortLabel || p.label}</text>`;
      }
    });

    const svg = `<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="${opts.title || ""}">
      <line class="gridline" x1="${padL}" y1="${padT + innerH}" x2="${padL + innerW}" y2="${padT + innerH}"></line>
      ${bars}
      ${targetTicks}
      ${labels}
    </svg>`;

    const div = document.createElement("div");
    div.className = "chart-wrap";
    div.innerHTML = svg;
    if (hasAnyTarget) {
      const legend = document.createElement("div");
      legend.style.cssText = "font-size:11px;color:var(--text-muted);margin-top:2px;";
      legend.innerHTML = `<span style="display:inline-block;width:14px;height:3px;background:var(--brand-black);vertical-align:middle;margin-right:4px;"></span>目標線(推算)`;
      div.appendChild(legend);
    }
    const svgEl = div.querySelector("svg");
    svgEl.querySelectorAll(".bar").forEach((rect, i) => {
      const p = points[i];
      const targetLine = p.target != null ? `<br>目標(推算): ${opts.fmt(p.target)}` : "";
      rect.addEventListener("mousemove", (evt) => {
        showTip(evt, `<b>${p.label}</b><br>${opts.metric}: ${opts.fmt(p.value)}${targetLine}${p.provisional ? "<br><i>暫估，尚未結算</i>" : ""}`);
      });
      rect.addEventListener("mouseleave", hideTip);
    });
    return div;
  }

  // 主力產品/大幅變動品項：跟上一期比，哪個分類漲最多、哪個跌最多，一眼看出這期是誰在拉業績/扯後腿。
  // 門檻設 $50 以上的變動才顯示，避免小分類的雜訊被當成「大幅變動」。
  function topMoverHtml(byCategory, prevByCategory) {
    if (!prevByCategory) return "";
    const cats = new Set([...Object.keys(byCategory || {}), ...Object.keys(prevByCategory || {})]);
    const diffs = [...cats].map((cat) => {
      const curr = (byCategory && byCategory[cat] && byCategory[cat].revenue) || 0;
      const prev = (prevByCategory[cat] && prevByCategory[cat].revenue) || 0;
      return { cat, curr, prev, diff: curr - prev };
    }).filter((d) => Math.abs(d.diff) >= 50);
    if (diffs.length === 0) return "";
    diffs.sort((a, b) => b.diff - a.diff);
    const top = diffs[0];
    const bottom = diffs[diffs.length - 1];
    const parts = [];
    if (top && top.diff > 0) parts.push(`<span style="color:var(--good)">▲ ${top.cat}</span> 較上期多賣 US$${fmtNum(top.diff)}`);
    if (bottom && bottom.diff < 0 && bottom.cat !== top.cat) parts.push(`<span style="color:var(--critical)">▼ ${bottom.cat}</span> 較上期少賣 US$${fmtNum(Math.abs(bottom.diff))}`);
    if (parts.length === 0) return "";
    return `<div style="font-size:13px;color:var(--text-secondary);margin:-4px 0 14px;">📌 ${parts.join("　")}</div>`;
  }

  // 週目標是用月目標按天數/歷史通路佔比推算的參考值，標籤加「推算」避免被誤會成官方訂的個別目標
  function targetTile(p) {
    if (p.targetUSD == null) return "";
    const rate = p.achievementRate;
    const cls = rate >= 100 ? "good" : rate >= 80 ? "warning" : "critical";
    const icon = rate >= 100 ? "🟢" : rate >= 80 ? "🟡" : "🔴";
    return `<div class="stat-tile" style="--tile-accent:var(--${cls})">
      <div class="stat-label">${icon} 本期目標達成率(推算)</div>
      <div class="stat-value ${cls}">${rate.toFixed(1)}%</div>
      <div class="progress-track"><div class="progress-fill ${cls}" style="width:${Math.min(100, rate)}%"></div></div>
    </div>`;
  }

  function deltaEl(curr, prev) {
    if (prev == null || prev === 0) return `<div class="stat-delta flat">—</div>`;
    const pct = ((curr - prev) / prev) * 100;
    const cls = pct > 0.5 ? "up" : pct < -0.5 ? "down" : "flat";
    const sign = pct > 0 ? "▲" : pct < 0 ? "▼" : "•";
    return `<div class="stat-delta ${cls}">${sign} ${Math.abs(pct).toFixed(1)}% 較上期</div>`;
  }

  // 兩層表：分類(粗體，點了展開/收合) + 底下該分類的SKU明細。
  // 分類對應 sherriva.com 官網選單分類，是業務平常講的語言；SKU 是給想深入看的人用的。
  function categoryTable(byCategory, byProduct, opts) {
    const catRows = Object.entries(byCategory || {})
      .filter(([, v]) => v.qty || v.revenue)
      .sort((a, b) => b[1].revenue - a[1].revenue);
    if (catRows.length === 0) return `<div style="color:var(--text-muted);font-size:13px;">（此期無明細）</div>`;

    const groups = opts.productGroups || {};
    const skuByCategory = {};
    for (const [sku, v] of Object.entries(byProduct || {})) {
      const cat = groups[sku] || "未分類";
      if (!skuByCategory[cat]) skuByCategory[cat] = [];
      skuByCategory[cat].push([sku, v]);
    }

    let html = `<table class="cat-table">
      <caption>${opts.caption}（點分類可展開細項）</caption>
      <thead><tr><th>分類</th><th class="num">數量</th><th class="num">金額</th></tr></thead>
      <tbody>`;
    catRows.forEach(([cat, v], i) => {
      const skus = (skuByCategory[cat] || []).sort((a, b) => b[1].revenue - a[1].revenue);
      const st = catStyle(cat);
      html += `<tr class="cat-row" data-cat-idx="${i}"><td><span class="caret">▸</span><span class="cat-icon">${st.icon}</span>${cat}</td><td class="num">${fmtNum(v.qty)}</td><td class="num" style="color:${st.color}">${opts.moneyFmt(v.revenue)}</td></tr>`;
      skus.forEach(([sku, sv]) => {
        html += `<tr class="sku-row" data-cat-idx="${i}"><td>${sku}</td><td class="num">${fmtNum(sv.qty)}</td><td class="num">${opts.moneyFmt(sv.revenue)}</td></tr>`;
      });
    });
    html += `</tbody></table>`;
    return html;
  }

  function wireCategoryTable(container) {
    const table = container.querySelector("table.cat-table");
    if (!table) return;
    table.querySelectorAll("tr.cat-row").forEach((row) => {
      row.addEventListener("click", () => {
        const idx = row.dataset.catIdx;
        const open = row.classList.toggle("open");
        table.querySelectorAll(`tr.sku-row[data-cat-idx="${idx}"]`).forEach((sr) => sr.classList.toggle("open", open));
      });
    });
  }

  // ---------- 週報 ----------
  function buildWeeklyCard(chDef) {
    const periods = DATA.periods.filter((p) => p.channel === chDef.key).sort((a, b) => a.startDate.localeCompare(b.startDate));
    const card = document.createElement("div");
    card.className = "card";
    card.style.setProperty("--card-accent", chDef.color);
    if (periods.length === 0) {
      card.innerHTML = `<div class="channel-name"><span class="channel-icon">${chDef.icon}</span>${chDef.label}</div><div style="color:var(--text-muted)">尚無資料</div>`;
      return card;
    }
    const head = document.createElement("div");
    head.className = "card-head";
    head.innerHTML = `<div class="channel-name"><span class="channel-icon">${chDef.icon}</span>${chDef.label}</div>
      <select class="period-select"></select>`;
    card.appendChild(head);

    const select = head.querySelector("select");
    periods.forEach((p, i) => {
      const opt = document.createElement("option");
      opt.value = i;
      const dqFlag = (p.dataQualityWarnings && p.dataQualityWarnings.length) ? "⚠️" : "";
      opt.textContent = dqFlag + p.label + (p.month === maxMonth(periods) && i === periods.length - 1 ? "（最新）" : "");
      select.appendChild(opt);
    });
    select.value = periods.length - 1;

    const body = document.createElement("div");
    card.appendChild(body);

    function render() {
      const idx = +select.value;
      const p = periods[idx];
      const prev = periods[idx - 1];
      const moneyFmt = fmtUSD;

      let extraRegion = "";
      if (chDef.key === "Amazon" && p.byRegion) {
        const included = Object.entries(p.byRegion).filter(([, v]) => v.includedInUSDTotal && v.currency !== "USD");
        const excluded = Object.entries(p.byRegion).filter(([, v]) => !v.includedInUSDTotal);
        const lines = [];
        if (included.length) {
          lines.push(`已換算併入：${included.map(([r, v]) => `${r} ${fmtNum(v.revenue)} ${v.currency}`).join("　")}`);
        }
        if (excluded.length) {
          lines.push(`未併入(無可靠匯率，僅列數量)：${excluded.map(([r, v]) => `${r} ${fmtNum(v.qty)}件`).join("　")}`);
        }
        if (lines.length) {
          extraRegion = `<div style="font-size:12px;color:var(--text-muted);margin-top:-6px;margin-bottom:14px;">${lines.join("　｜　")}</div>`;
        }
      }

      const dqWarning = (p.dataQualityWarnings && p.dataQualityWarnings.length)
        ? `<div class="inv-alert-banner" style="margin-bottom:14px;"><span>⚠️</span><span><b>這期資料品質存疑：</b>${p.dataQualityWarnings.join("；")}</span></div>`
        : "";
      body.innerHTML = `
        <div style="font-size:13px;color:var(--text-muted);margin-bottom:10px;">${p.startDate} ~ ${p.endDate}　來源：${p.source}</div>
        ${dqWarning}
        <div class="stat-row">
          <div class="stat-tile" style="--tile-accent:${chDef.color}">
            <div class="stat-label">💰 銷售額</div>
            <div class="stat-value">${moneyFmt(p.totalRevenueUSD)}</div>
            ${deltaEl(p.totalRevenueUSD, prev && prev.totalRevenueUSD)}
          </div>
          <div class="stat-tile">
            <div class="stat-label">📦 銷售數量</div>
            <div class="stat-value">${fmtNum(p.totalUnits)}</div>
            ${deltaEl(p.totalUnits, prev && prev.totalUnits)}
          </div>
          <div class="stat-tile">
            <div class="stat-label">${chDef.key === "官網" ? "🧾 訂單數" : "🗓️ 區間"}</div>
            <div class="stat-value" style="${chDef.key !== "官網" ? "font-size:20px" : ""}">${chDef.key === "官網" ? fmtNum(p.ordersCount) : p.label}</div>
          </div>
          ${targetTile(p)}
        </div>
        ${extraRegion}
        ${topMoverHtml(p.byCategory, prev && prev.byCategory)}
      `;

      const chartData = periods.map((pp) => ({
        label: pp.label,
        shortLabel: pp.label.split("-")[0],
        value: pp.totalRevenueUSD,
        target: pp.targetUSD,
      }));
      const chartWrap = renderBarChart(chartData, {
        color: chDef.color, fill: chDef.fill, metric: "銷售額", fmt: moneyFmt, title: chDef.label + " 各期銷售額",
      });
      const oldChart = body.querySelector(".chart-wrap");
      if (oldChart) oldChart.remove();
      body.appendChild(chartWrap);

      const tableWrap = document.createElement("div");
      tableWrap.style.marginTop = "16px";
      tableWrap.innerHTML = categoryTable(p.byCategory, p.byProduct, { caption: "本期產品明細", moneyFmt, productGroups: DATA.meta.productGroups });
      const oldTable = body.querySelector("table.cat-table");
      if (oldTable) oldTable.closest("div").remove();
      body.appendChild(tableWrap);
      wireCategoryTable(tableWrap);
    }
    select.addEventListener("change", render);
    render();
    return card;
  }

  function maxMonth(periods) {
    return Math.max(...periods.map((p) => p.month));
  }

  // ---------- 月報 ----------
  function buildMonthlyCard(chDef) {
    const months = DATA.monthly.filter((m) => m.channel === chDef.key).sort((a, b) => a.year - b.year || a.month - b.month);
    const card = document.createElement("div");
    card.className = "card";
    card.style.setProperty("--card-accent", chDef.color);
    if (months.length === 0) {
      card.innerHTML = `<div class="channel-name"><span class="channel-icon">${chDef.icon}</span>${chDef.label}</div><div style="color:var(--text-muted)">尚無資料</div>`;
      return card;
    }
    const head = document.createElement("div");
    head.className = "card-head";
    head.innerHTML = `<div class="channel-name"><span class="channel-icon">${chDef.icon}</span>${chDef.label}</div>
      <select class="period-select"></select>`;
    card.appendChild(head);

    const select = head.querySelector("select");
    months.forEach((m, i) => {
      const provisional = /暫估/.test(m.source);
      const opt = document.createElement("option");
      opt.value = i;
      opt.textContent = `${m.year}年${m.month}月` + (provisional ? "（暫估）" : "");
      select.appendChild(opt);
    });
    select.value = months.length - 1;

    const body = document.createElement("div");
    card.appendChild(body);

    function render() {
      const idx = +select.value;
      const m = months[idx];
      const prev = months[idx - 1];
      const moneyFmt = fmtUSD;
      const provisional = /暫估/.test(m.source);

      body.innerHTML = `
        <div style="font-size:13px;color:var(--text-muted);margin-bottom:10px;">
          ${m.year}年${m.month}月　來源：${m.source}
          ${provisional ? `<span class="badge provisional">尚未結算</span>` : `<span class="badge">財務已結算</span>`}
        </div>
        <div class="stat-row">
          <div class="stat-tile" style="--tile-accent:${chDef.color}">
            <div class="stat-label">💰 月銷售額</div>
            <div class="stat-value">${moneyFmt(m.totalRevenueUSD)}</div>
            ${deltaEl(m.totalRevenueUSD, prev && prev.totalRevenueUSD)}
          </div>
          ${targetTile(m)}
        </div>
      `;

      const chartData = months.map((mm) => ({
        label: `${mm.year}/${mm.month}`,
        shortLabel: mm.month + "月",
        value: mm.totalRevenueUSD,
        target: mm.targetUSD,
        provisional: /暫估/.test(mm.source),
      }));
      const chartWrap = renderBarChart(chartData, {
        color: chDef.color, fill: chDef.fill, metric: "月銷售額", fmt: moneyFmt, title: chDef.label + " 月銷售額趨勢",
      });
      body.appendChild(chartWrap);

      const oldTable = body.querySelector("table.cat-table");
      if (oldTable) oldTable.closest("div").remove();
      const tableWrap = document.createElement("div");
      tableWrap.style.marginTop = "16px";
      tableWrap.innerHTML = categoryTable(m.byCategory, m.byProduct, { caption: "本月產品明細", moneyFmt, productGroups: DATA.meta.productGroups });
      body.appendChild(tableWrap);
      wireCategoryTable(tableWrap);
    }
    select.addEventListener("change", render);
    render();
    return card;
  }

  // ---------- 首頁核心KPI：只放「目標/實績/達成率」三張卡 ----------
  // 2026-08-30 依使用者要求做減法：首頁第一眼只看這三個數字。缺口/Forecast/異常/雷達
  // 這些分析的「計算」都還在 parse_reports.mjs 的 buildCockpit() 沒動，只是不在首頁
  // 頂部呈現，改到頁尾「經營提醒」(見 buildReminders)低調帶過。
  // 所有數字都是後端算好放進 DATA.cockpit，這裡純渲染，不在瀏覽器裡重算。
  function buildHero() {
    const hero = document.getElementById("hero");
    const company = (DATA.company || []).slice().sort((a, b) => a.year - b.year || a.month - b.month);
    if (company.length === 0) {
      hero.style.display = "none";
      return;
    }
    const latest = company[company.length - 1];
    const provisional = /暫估/.test(latest.source);
    const cp = DATA.cockpit;

    if (!cp) {
      // 防呆(例如舊版sales_data.json還沒有cockpit欄位)
      hero.innerHTML = `<div class="hero-period">${latest.year}年${latest.month}月</div><div style="color:var(--text-muted)">KPI資料尚未產生，請重新執行 parse_reports.mjs</div>`;
      return;
    }

    const hasTarget = cp.targetUSD != null;
    const rate = cp.achievementRate;
    const rateClass = !hasTarget ? "" : rate >= 100 ? "good" : rate >= 80 ? "warning" : "critical";

    hero.innerHTML = `
      <div class="hero-period">${latest.year}年${latest.month}月　官網＋Amazon合計　來源：${latest.source}${provisional ? ' <span class="badge provisional">尚未結算</span>' : ' <span class="badge">財務已結算</span>'}</div>
      <div class="hero-grid">
        <div class="hero-tile" style="--tile-accent:var(--brand-yellow)">
          <div class="hero-tile-label">🎯 業績目標</div>
          <div class="hero-tile-value ${hasTarget ? "" : "muted"}">${hasTarget ? fmtUSD(cp.targetUSD) : "尚未設定目標"}</div>
        </div>
        <div class="hero-tile" style="--tile-accent:var(--brand-black)">
          <div class="hero-tile-label">💰 目前實績</div>
          <div class="hero-tile-value">${fmtUSD(cp.actualUSD)}</div>
          <div class="hero-tile-sub">做到第${cp.daysElapsed}/${cp.daysInMonth}天</div>
        </div>
        <div class="hero-tile" style="--tile-accent:var(--${rateClass || "axis"})">
          <div class="hero-tile-label">${!hasTarget ? "📈" : rate >= 100 ? "🟢" : rate >= 80 ? "🟡" : "🔴"} 達成率</div>
          <div class="hero-tile-value ${hasTarget ? rateClass : "muted"}">${hasTarget ? rate.toFixed(1) + "%" : "—"}</div>
          ${hasTarget ? `<div class="progress-track"><div class="progress-fill ${rateClass}" style="width:${Math.min(100, rate)}%"></div></div>` : ""}
        </div>
      </div>
    `;
  }

  // ---------- 經營提醒(頁尾)：中性陳述事實，不下判斷、不給行動指令 ----------
  // 材料一樣來自後端算好的 DATA.cockpit / DATA.inventory，前端只挑重點、換成中性說法。
  // 克制原則：最多5條，優先序=缺貨(最可能直接影響銷售)>明顯銷售變化>庫存偏高；沒有就說沒有。
  function buildReminders() {
    const box = document.getElementById("remindersCard");
    if (!box) return;
    const cp = DATA.cockpit;
    const items = [];

    // 優先1+2：缺貨(有銷量卻快見底的品項)
    (DATA.inventory || [])
      .filter((i) => inventoryStatus(i).cls === "critical")
      .sort((a, b) => (a.daysOfSupply ?? 0) - (b.daysOfSupply ?? 0))
      .forEach((i) => {
        const extra = i.stockoutDaysThisMonth > 0 ? `，本月已缺貨 ${i.stockoutDaysThisMonth} 天` : "";
        items.push(`${i.sku} 庫存約可支撐 ${i.daysOfSupply != null ? i.daysOfSupply.toFixed(1) : "0"} 天${extra}`);
      });

    // 優先3：明顯的銷售變化(較上月跌三成以上、金額也夠大的分類，避免小分類雜訊)
    ((cp && cp.categoryMovers) || [])
      .filter((m) => m.previousUSD > 0 && m.diffUSD <= -1000 && Math.abs(m.diffUSD / m.previousUSD) >= 0.3)
      .sort((a, b) => a.diffUSD - b.diffUSD)
      .forEach((m) => {
        const pct = Math.abs((m.diffUSD / m.previousUSD) * 100).toFixed(0);
        items.push(`${m.category} 本月較上月下降 ${pct}%（${fmtUSD(m.previousUSD)} → ${fmtUSD(m.currentUSD)}）`);
      });

    // 優先4：庫存偏高(去化天數異常長，只列最明顯的前2個)
    ((cp && cp.capitalTiedUp) || []).slice(0, 2).forEach((i) => {
      if (i.daysOfSupply == null) {
        items.push(`${i.sku} 近 3 個月沒有銷量（現有庫存 ${fmtNum(i.currentStock)} 件）`);
      } else {
        const dTxt = i.daysOfSupply >= 365 ? `${(i.daysOfSupply / 365).toFixed(1)} 年` : `${fmtNum(i.daysOfSupply)} 天`;
        items.push(`${i.sku} 庫存去化天數偏高（現有 ${fmtNum(i.currentStock)} 件，照目前銷售速度約需 ${dTxt}才賣得完）`);
      }
    });

    const shown = items.slice(0, 5);
    const listHtml = shown.length === 0
      ? `<div class="reminder-empty">目前沒有重大經營提醒</div>`
      : shown.map((t) => `<div class="reminder-row">• ${t}</div>`).join("");

    // 缺口/Forecast降為次要資訊：小字灰色一行帶過，視覺層級低於上面所有數據
    let subLine = "";
    if (cp) {
      const parts = [];
      if (cp.targetUSD != null && cp.gapUSD > 0) parts.push(`本月剩餘缺口 ${fmtUSD(cp.gapUSD)}`);
      if (cp.forecastUSD != null) parts.push(`依目前銷售速度，月底預估業績約 ${fmtUSD(cp.forecastUSD)}`);
      if (parts.length) subLine = `<div class="reminder-sub">${parts.join("　·　")}</div>`;
    }

    box.innerHTML = `<div class="reminders-title">💡 經營提醒</div>${listHtml}${subLine}`;
  }

  // ---------- 庫存戰情 ----------
  // 庫存快照是手動/定期下載的，不是每次網頁更新都同步，時間點要清楚標出來避免業務誤會是即時庫存。
  function inventoryStatus(item) {
    if (!item.monthlyAvgSales) return { cls: "na", label: "⚪ 近3月無銷量" };
    if (item.stockoutDaysThisMonth > 0 || (item.daysOfSupply != null && item.daysOfSupply < 14)) {
      return { cls: "critical", label: "🔴 缺貨風險" };
    }
    if (item.daysOfSupply != null && item.daysOfSupply < 30) return { cls: "warning", label: "🟡 庫存偏低" };
    return { cls: "good", label: "🟢 庫存充足" };
  }

  function buildInventoryTab() {
    const container = document.getElementById("inventoryCard");
    const items = (DATA.inventory || []).slice();
    if (items.length === 0) {
      container.innerHTML = `<div style="color:var(--text-muted)">尚無庫存快照資料</div>`;
      return;
    }
    items.sort((a, b) => {
      const ra = inventoryStatus(a).cls, rb = inventoryStatus(b).cls;
      const order = { critical: 0, warning: 1, good: 2, na: 3 };
      if (order[ra] !== order[rb]) return order[ra] - order[rb];
      return (a.daysOfSupply ?? 99999) - (b.daysOfSupply ?? 99999);
    });
    const snapshotAt = DATA.inventorySnapshotAt ? new Date(DATA.inventorySnapshotAt).toLocaleString("zh-TW", { hour12: false }) : "未知";
    container.innerHTML = `
      <div style="font-size:13px;color:var(--text-muted);margin-bottom:14px;">
        庫存快照時間：${snapshotAt}（手動/定期從「Sherriva 庫銷管理表」下載，不是即時庫存，請留意快照時間）
      </div>
      <table class="inv-table">
        <thead><tr>
          <th>分類</th><th>SKU</th><th class="num">目前庫存</th><th class="num">本月斷貨天數</th>
          <th class="num">可撐天數</th><th class="num">在途數量</th><th>預計到港</th><th>狀態</th>
        </tr></thead>
        <tbody>
          ${items.map((i) => {
            const st = inventoryStatus(i);
            return `<tr>
              <td><span class="cat-icon">${catStyle(i.category).icon}</span>${i.category}</td>
              <td>${i.sku}</td>
              <td class="num">${fmtNum(i.currentStock)}</td>
              <td class="num">${i.stockoutDaysThisMonth > 0 ? `<b style="color:var(--critical)">${i.stockoutDaysThisMonth}</b>` : "0"}</td>
              <td class="num">${i.daysOfSupply != null ? i.daysOfSupply.toFixed(1) : "—"}</td>
              <td class="num">${fmtNum(i.inTransitTotal)}</td>
              <td>${i.etaDate || "—"}</td>
              <td><span class="inv-badge ${st.cls}">${st.label}</span></td>
            </tr>`;
          }).join("")}
        </tbody>
      </table>
    `;
  }

  // ---------- Amazon 分站(目前只有中東/UAE有量，金額是當地幣別AED，不換算USD避免算錯) ----------
  function buildRegionCard(region, currencyLabel, label) {
    const periods = DATA.periods
      .filter((p) => p.channel === "Amazon" && p.byRegionDetail && p.byRegionDetail[region])
      .sort((a, b) => a.startDate.localeCompare(b.startDate));
    const card = document.createElement("div");
    card.className = "card";
    card.style.gridColumn = "1 / -1";
    if (periods.length === 0) {
      card.innerHTML = `<div class="channel-name">${label}</div><div style="color:var(--text-muted)">近期無銷售資料</div>`;
      return card;
    }
    const head = document.createElement("div");
    head.className = "card-head";
    head.innerHTML = `<div class="channel-name">${label}</div><select class="period-select"></select>`;
    card.appendChild(head);
    const select = head.querySelector("select");
    periods.forEach((p, i) => {
      const opt = document.createElement("option");
      opt.value = i;
      opt.textContent = p.label + (i === periods.length - 1 ? "（最新）" : "");
      select.appendChild(opt);
    });
    select.value = periods.length - 1;

    const body = document.createElement("div");
    card.appendChild(body);
    const moneyFmt = (v) => fmtNum(v) + " " + currencyLabel;

    function render() {
      const idx = +select.value;
      const p = periods[idx];
      const detail = p.byRegionDetail[region];
      const regionTotal = p.byRegion[region] || { qty: 0, revenue: 0, includedInUSDTotal: false };
      const rate = DATA.meta.fxRateAEDperUSD;
      const convertedNote = regionTotal.includedInUSDTotal
        ? `已用固定匯率(1USD=${rate} ${currencyLabel})換算，併入上方 Amazon 實際業績`
        : `金額為當地幣別，目前沒有可靠匯率來源，未併入 Amazon 實際業績`;
      body.innerHTML = `
        <div style="font-size:13px;color:var(--text-muted);margin-bottom:10px;">${p.startDate} ~ ${p.endDate}　${convertedNote}</div>
        <div class="stat-row">
          <div class="stat-tile">
            <div class="stat-label">銷售額</div>
            <div class="stat-value">${moneyFmt(regionTotal.revenue)}</div>
            ${regionTotal.includedInUSDTotal ? `<div class="stat-delta flat">≈ ${fmtUSD(regionTotal.revenue / rate)}</div>` : ""}
          </div>
          <div class="stat-tile">
            <div class="stat-label">銷售數量</div>
            <div class="stat-value">${fmtNum(regionTotal.qty)}</div>
          </div>
        </div>
      `;
      const tableWrap = document.createElement("div");
      tableWrap.style.marginTop = "16px";
      tableWrap.innerHTML = categoryTable(detail.byCategory, detail.byProduct, { caption: "本期產品明細", moneyFmt, productGroups: DATA.meta.productGroups });
      body.appendChild(tableWrap);
      wireCategoryTable(tableWrap);
    }
    select.addEventListener("change", render);
    render();
    return card;
  }

  // ---------- 每週的日銷售報表(目前只有官網，因為只有 Shopify API 有辦法抓到日粒度；
  // Amazon 還是靠 Holly 每7天寄信，沒有逐日資料來源) ----------
  // 這裡是「自然週(週一~週日) + 逐日」的報表，跟「週報」分頁(官網10天一旬)是不同的兩件事。
  const WEEKDAY_LABEL = ["日", "一", "二", "三", "四", "五", "六"];
  function isoMonday(dateStr) {
    const d = new Date(dateStr + "T00:00:00");
    const day = d.getDay();
    d.setDate(d.getDate() + (day === 0 ? -6 : 1 - day));
    return d.toISOString().slice(0, 10);
  }
  function addDays(dateStr, n) {
    const d = new Date(dateStr + "T00:00:00");
    d.setDate(d.getDate() + n);
    return d.toISOString().slice(0, 10);
  }
  function mdLabel(dateStr) {
    const [, m, d] = dateStr.split("-");
    return `${+m}/${+d}`;
  }

  function buildDailyCard() {
    const days = DATA.dailyOfficial || [];
    const card = document.createElement("div");
    card.className = "card";
    card.style.gridColumn = "1 / -1";
    card.style.setProperty("--card-accent", "var(--series-official)");
    if (days.length === 0) {
      card.innerHTML = `<div class="channel-name"><span class="channel-icon">🌐</span>官網 每週日銷售報表</div><div style="color:var(--text-muted)">尚無資料(需設定 shopify_config.json)</div>`;
      return card;
    }

    const byWeek = {};
    for (const d of days) {
      const wk = isoMonday(d.date);
      (byWeek[wk] || (byWeek[wk] = [])).push(d);
    }
    const weeks = Object.keys(byWeek).sort().map((wk) => {
      const weekDays = byWeek[wk];
      const byCategory = {};
      const byProduct = {};
      for (const d of weekDays) {
        for (const [k, v] of Object.entries(d.byCategory || {})) addToBucketLocal(byCategory, k, v.qty, v.revenue);
        for (const [k, v] of Object.entries(d.byProduct || {})) addToBucketLocal(byProduct, k, v.qty, v.revenue);
      }
      return {
        weekStart: wk, weekEnd: addDays(wk, 6), days: weekDays,
        totalRevenueUSD: weekDays.reduce((s, d) => s + d.totalRevenueUSD, 0),
        totalUnits: weekDays.reduce((s, d) => s + d.totalUnits, 0),
        ordersCount: weekDays.reduce((s, d) => s + d.ordersCount, 0),
        byCategory, byProduct,
        isCurrent: weekDays.some((d) => d.provisional),
      };
    });
    function addToBucketLocal(bucket, key, qty, revenue) {
      if (!bucket[key]) bucket[key] = { qty: 0, revenue: 0 };
      bucket[key].qty += qty; bucket[key].revenue += revenue;
    }

    const head = document.createElement("div");
    head.className = "card-head";
    head.innerHTML = `<div class="channel-name"><span class="channel-icon">🌐</span>官網 每週日銷售報表</div>
      <select class="period-select"></select>`;
    card.appendChild(head);

    const select = head.querySelector("select");
    weeks.forEach((w, i) => {
      const opt = document.createElement("option");
      opt.value = i;
      opt.textContent = `${mdLabel(w.weekStart)} - ${mdLabel(w.weekEnd)}` + (w.isCurrent ? "（本週，進行中）" : "");
      select.appendChild(opt);
    });
    select.value = weeks.length - 1;

    const body = document.createElement("div");
    card.appendChild(body);
    const moneyFmt = fmtUSD;

    function render() {
      const idx = +select.value;
      const w = weeks[idx];
      const prev = weeks[idx - 1];
      const todayStr = new Date().toISOString().slice(0, 10);

      body.innerHTML = `
        <div style="font-size:13px;color:var(--text-muted);margin-bottom:10px;">
          ${w.weekStart} ~ ${w.weekEnd}${w.isCurrent ? '<span class="week-pill">本週進行中</span>' : ""}
        </div>
        <div class="stat-row">
          <div class="stat-tile" style="--tile-accent:var(--series-official)">
            <div class="stat-label">💰 本週銷售額</div>
            <div class="stat-value">${moneyFmt(w.totalRevenueUSD)}</div>
            ${deltaEl(w.totalRevenueUSD, prev && prev.totalRevenueUSD)}
          </div>
          <div class="stat-tile">
            <div class="stat-label">📦 本週銷售數量</div>
            <div class="stat-value">${fmtNum(w.totalUnits)}</div>
            ${deltaEl(w.totalUnits, prev && prev.totalUnits)}
          </div>
          <div class="stat-tile">
            <div class="stat-label">🧾 本週訂單數</div>
            <div class="stat-value">${fmtNum(w.ordersCount)}</div>
            ${deltaEl(w.ordersCount, prev && prev.ordersCount)}
          </div>
        </div>
      `;

      // 2026-08-30 使用者指示：每日分頁不放週趨勢圖，只要業績數字(上面的統計卡+下面的逐日明細表)。
      // 跨週趨勢要看的話，週報/月報分頁的圖表都還在。
      const dayRows = w.days.map((d) => {
        const wd = WEEKDAY_LABEL[new Date(d.date + "T00:00:00").getDay()];
        const isToday = d.date === todayStr;
        return `<tr>
          <td class="${isToday ? "today" : ""}">${d.date}${d.provisional ? ' <span class="badge provisional">今日</span>' : ""}</td>
          <td>週${wd}</td>
          <td class="num ${isToday ? "today" : ""}">${moneyFmt(d.totalRevenueUSD)}</td>
          <td class="num">${fmtNum(d.totalUnits)}</td>
          <td class="num">${fmtNum(d.ordersCount)}</td>
        </tr>`;
      }).join("");
      const tableWrap = document.createElement("div");
      tableWrap.style.marginTop = "16px";
      tableWrap.innerHTML = `<table class="prod-table week-day-table">
        <caption>本週每日明細</caption>
        <thead><tr><th>日期</th><th>星期</th><th class="num">銷售額</th><th class="num">數量</th><th class="num">訂單數</th></tr></thead>
        <tbody>${dayRows}</tbody>
      </table>`;
      body.appendChild(tableWrap);

      const catWrap = document.createElement("div");
      catWrap.style.marginTop = "16px";
      catWrap.innerHTML = categoryTable(w.byCategory, w.byProduct, { caption: "本週產品明細", moneyFmt, productGroups: DATA.meta.productGroups });
      body.appendChild(catWrap);
      wireCategoryTable(catWrap);
    }
    select.addEventListener("change", render);
    render();
    return card;
  }

  // ---------- 組裝頁面 ----------
  buildHero();
  buildReminders();
  buildInventoryTab();
  const dailyGrid = document.getElementById("dailyGrid");
  dailyGrid.appendChild(buildDailyCard());

  const weeklyGrid = document.getElementById("weeklyGrid");
  CH.forEach((c) => weeklyGrid.appendChild(buildWeeklyCard(c)));
  weeklyGrid.appendChild(buildRegionCard("UAE", "AED", "Amazon(中東站/UAE)"));

  const monthlyGrid = document.getElementById("monthlyGrid");
  CH.forEach((c) => monthlyGrid.appendChild(buildMonthlyCard(c)));

  document.querySelectorAll("nav.tabs button").forEach((btn) => {
    btn.addEventListener("click", () => {
      document.querySelectorAll("nav.tabs button").forEach((b) => b.classList.remove("active"));
      btn.classList.add("active");
      document.querySelectorAll(".view").forEach((v) => v.classList.remove("active"));
      document.getElementById("view-" + btn.dataset.view).classList.add("active");
    });
  });

  const updated = new Date(DATA.generatedAt);
  document.getElementById("updatedAt").textContent = "資料更新時間：" + updated.toLocaleString("zh-TW", { hour12: false });

  document.getElementById("subnote").innerHTML = `
    官網＋Amazon 銷售量彙整，供業務查詢每週逐日(僅官網)、每期(週報)與每月銷售狀況。
    <b>Amazon 金額已換算為USD：美國站(USD，匯率1:1)＋阿聯酋站(AED，固定匯率 1USD=${DATA.meta.fxRateAEDperUSD} AED)</b>，
    加拿大/沙特等其他站點目前沒有可靠匯率來源，只列數量、金額未併入；月報總額則採財務結算後的
    <b>表2 官網 / 表3 Amazon 彙總</b>數字為準。
  `;

  // 2026-08-30 使用者指示：頁尾不放大段口徑說明。這些說明(銷售額vs SKU明細口徑、資料涵蓋範圍、
  // 目標換算匯率等)保留在專案交接筆記.md，需要時再查，網頁上不顯示。
})();
</script>
</body>
</html>
